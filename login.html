<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrar — Kristal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07070a;
  --surface:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.10);
  --indigo:#6366f1;
  --indigo-dark:#3730a3;
  --glow:#a5b4fc;
  --text:#f2f2f6;
  --muted:#9b9ba7;
  --danger:#f87171;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(50vw 50vw at 90% -10%,rgba(99,102,241,.16),transparent 60%),
    radial-gradient(45vw 45vw at 0% 100%,rgba(55,48,163,.14),transparent 60%);
}

.container{
  width:min(430px,calc(100% - 32px));
  position:relative;
  z-index:2;
}

.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  margin-bottom:28px;
  font-family:"Space Grotesk",sans-serif;
  font-size:22px;
  font-weight:600;
}

.logo svg{
  width:25px;
  height:25px;
}

.card{
  padding:34px;
  border:1px solid var(--border);
  border-radius:20px;
  background:linear-gradient(
    155deg,
    rgba(255,255,255,.085),
    rgba(255,255,255,.035)
  );
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.07) inset,
    0 30px 70px -30px rgba(0,0,0,.8);
}

.eyebrow{
  color:var(--glow);
  font-size:11px;
  font-family:monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
}

h1{
  margin-top:7px;
  font-family:"Space Grotesk",sans-serif;
  font-size:28px;
  font-weight:500;
}

.subtitle{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.form{
  margin-top:28px;
}

.field{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#c7c7d0;
  font-size:12px;
}

.input{
  width:100%;
  height:48px;
  padding:0 14px;
  border-radius:11px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.035);
  color:var(--text);
  outline:none;
  font:inherit;
  font-size:14px;
}

.input::placeholder{
  color:#5c5c68;
}

.input:focus{
  border-color:rgba(165,180,252,.55);
  background:rgba(99,102,241,.06);
  box-shadow:0 0 0 3px rgba(99,102,241,.12);
}

.password-wrap{
  position:relative;
}

.password-wrap .input{
  padding-right:48px;
}

.show-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#777783;
  cursor:pointer;
  font-size:15px;
}

.error{
  display:none;
  margin-bottom:15px;
  padding:11px 13px;
  border-radius:10px;
  background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.25);
  color:var(--danger);
  font-size:12.5px;
}

.error.show{
  display:block;
}

.btn{
  width:100%;
  height:48px;
  border:1px solid rgba(165,180,252,.4);
  border-radius:11px;
  background:linear-gradient(155deg,var(--indigo),var(--indigo-dark));
  color:white;
  font:600 14px Inter,sans-serif;
  cursor:pointer;
  box-shadow:
    0 12px 30px -12px rgba(99,102,241,.8),
    0 1px 0 rgba(255,255,255,.2) inset;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.bottom{
  margin-top:24px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.bottom a{
  color:var(--glow);
  font-weight:600;
  text-decoration:none;
}

.bottom a:hover{
  text-decoration:underline;
}

.home{
  display:block;
  margin-top:18px;
  text-align:center;
  color:#666672;
  font-size:12px;
  text-decoration:none;
}

.home:hover{
  color:var(--text);
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none">
      <polygon
        points="12,1 22,8 18,23 6,23 2,8"
        fill="url(#logoGradient)"
      />

      <defs>
        <linearGradient
          id="logoGradient"
          x1="2"
          y1="1"
          x2="22"
          y2="23"
        >
          <stop stop-color="#a5b4fc"/>
          <stop offset="1" stop-color="#4338ca"/>
        </linearGradient>
      </defs>
    </svg>

    Kristal
  </div>

  <div class="card">

    <span class="eyebrow">Acesso</span>

    <h1>Entrar na Kristal</h1>

    <p class="subtitle">
      Entre com o e-mail e a senha que você cadastrou.
    </p>

    <form class="form" id="login-form">

      <div class="field">
        <label for="email">E-mail</label>

        <input
          class="input"
          id="email"
          type="email"
          placeholder="seu@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">

        <label for="senha">Senha</label>

        <div class="password-wrap">

          <input
            class="input"
            id="senha"
            type="password"
            placeholder="Sua senha"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="show-password"
          >
            ◉
          </button>

        </div>

      </div>

      <div class="error" id="error">
        E-mail ou senha incorretos.
      </div>

      <button class="btn" type="submit">
        Entrar
      </button>

    </form>

    <div class="bottom">
      Ainda não tem uma conta?
      <a href="/cadastro">Criar conta</a>
    </div>

    <a href="/" class="home">
      ← Voltar para o início
    </a>

  </div>

</div>


<script>

const form = document.getElementById("login-form");

const emailInput =
  document.getElementById("email");

const senhaInput =
  document.getElementById("senha");

const error =
  document.getElementById("error");


/* Mostrar / esconder senha */

document
  .getElementById("show-password")
  .addEventListener("click", () => {

    if(senhaInput.type === "password"){
      senhaInput.type = "text";
    }else{
      senhaInput.type = "password";
    }

  });


/* Login */

form.addEventListener("submit", function(e){

  e.preventDefault();

  error.classList.remove("show");

  const email =
    emailInput.value.trim().toLowerCase();

  const senha =
    senhaInput.value;


  /*
    Pega a conta criada no cadastro
  */

  const account =
    JSON.parse(
      localStorage.getItem("kristal_account")
    );


  if(!account){

    error.textContent =
      "Nenhuma conta encontrada. Faça seu cadastro primeiro.";

    error.classList.add("show");

    return;
  }


  /*
    Confere e-mail e senha
  */

  if(
    email !== account.email.toLowerCase() ||
    senha !== account.password
  ){

    error.textContent =
      "E-mail ou senha incorretos.";

    error.classList.add("show");

    return;
  }


  /*
    Login realizado
  */

  localStorage.setItem(
    "kristal_logged_in",
    "true"
  );


  localStorage.setItem(
    "kristal_current_user",
    JSON.stringify({
      name:account.name,
      email:account.email
    })
  );


  /*
    Vai para o dashboard
  */

  window.location.href = "/dashboard";

});

</script>

</body>
</html>
